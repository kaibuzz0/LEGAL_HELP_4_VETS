name: One-shot former-owner foreclosure precision

on:
  push:
    branches: [phase5-california-final-precision]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-california-final-precision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch former-owner authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/california-foreclosure.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          auths = data['authorities']
          if not any(a.get('id') == 'ca-ccp-1161a' for a in auths):
              auths.append({
                  'id':'ca-ccp-1161a',
                  'citation':'Cal. Code Civ. Proc. § 1161a',
                  'authority_type':'statute',
                  'jurisdiction':'California',
                  'status':'verified',
                  'last_verified':'2026-09-02',
                  'source_url':'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CCP&sectionNum=1161a.',
                  'supports':['Post-foreclosure unlawful detainer under §1161a(b)(3) requires a sale in accordance with Civil Code §2924 under the deed-of-trust power of sale and title under the sale to have been duly perfected; the statute provides a post-sale possession route distinct from ordinary tenant protections.']
              })
          if not any(a.get('id') == 'ca-supreme-dr-leevil' for a in auths):
              auths.append({
                  'id':'ca-supreme-dr-leevil',
                  'citation':'Dr. Leevil, LLC v. Westlake Health Care Center, 6 Cal.5th 474 (2018)',
                  'authority_type':'case_law',
                  'jurisdiction':'California',
                  'status':'verified',
                  'last_verified':'2026-09-02',
                  'source_url':'https://supreme.courts.ca.gov/sites/default/files/supremecourt/default/documents/S241324.pdf',
                  'supports':['California Supreme Court held that §1161a(b)(3) conditions, including duly perfected title, are prerequisites before serving the notice to quit; title perfection in that context requires recording the trustee’s deed.']
              })
          route = data['routes']['post_sale_former_owner']
          route['status'] = 'partially_verified'
          route['authorities'] = ['ca-ccp-1161a','ca-supreme-dr-leevil']
          route['clock'] = None
          route['warnings'] = [
              'For the §1161a(b)(3) post-foreclosure possession route, the purchaser must establish a sale in accordance with Civil Code §2924 and duly perfected title.',
              'Dr. Leevil holds that the statutory conditions, including perfected title and recording of the trustee’s deed, must be satisfied before the notice to quit is served.',
              'Do not automatically apply bona-fide-tenant protections to the former borrower/owner, but do not treat the trustee sale itself as permission for immediate physical lockout.',
              'The exact notice-computation clock remains unpublished until service and generally applicable computation rules are fully reconciled.'
          ]
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m unittest tests.test_california_foreclosure
          python scripts/validate_california_foreclosure.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-former-owner-precision.yml
          git add data/california-foreclosure.json
          git commit -m 'Verify former-owner post-foreclosure route'
          git push origin HEAD:phase5-california-final-precision
