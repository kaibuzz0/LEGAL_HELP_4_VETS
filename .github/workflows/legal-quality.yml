name: Legal Content Quality

on:
  push:
    branches: [main, legal-accuracy-foundation, veteran-emergency-medical-rights, phase2-legal-qa-hardening, phase3-procedural-depth]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  legal-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML regression tests
        run: python -m unittest tests.test_html
      - name: Source registry tests
        run: python -m unittest tests.test_sources
      - name: Internal HTML link tests
        run: python -m unittest tests.test_internal_links
      - name: Phase 2 legal quality tests
        run: python -m unittest tests.test_phase2_legal_quality
      - name: Phase 3 procedural depth tests
        run: python -m unittest tests.test_phase3_procedural_depth
      - name: Legal language review scan
        run: python tests/test_legal_language.py
