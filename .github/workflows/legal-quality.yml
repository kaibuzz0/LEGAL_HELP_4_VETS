name: Legal Content Quality

on:
  push:
    branches: [main, legal-accuracy-foundation, veteran-emergency-medical-rights, phase2-legal-qa-hardening, phase3-procedural-depth, phase4-state-housing-depth, phase4-state-schema, phase5-california-housing, phase5-california-foreclosure, phase5-california-foreclosure-hardening, phase5-california-final-precision, phase6-state-replication-contract, phase7-florida-housing, phase7-florida-precision-hardening, phase8-core-site-expansion]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  legal-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML regression tests
        run: python -m unittest tests.test_html
      - name: Source registry tests
        run: python -m unittest tests.test_sources
      - name: Internal HTML link tests
        run: python -m unittest tests.test_internal_links
      - name: Phase 2 legal quality tests
        run: python -m unittest tests.test_phase2_legal_quality
      - name: Phase 3 procedural depth tests
        run: python -m unittest tests.test_phase3_procedural_depth
      - name: Phase 4 state housing tests
        run: python -m unittest tests.test_phase4_state_housing
      - name: State schema tests
        run: python -m unittest tests.test_state_schema
      - name: California housing tests
        run: python -m unittest tests.test_california_housing
      - name: California foreclosure tests
        run: python -m unittest tests.test_california_foreclosure
      - name: California final precision tests
        run: python -m unittest tests.test_california_final_precision
      - name: State replication contract tests
        run: python -m unittest tests.test_state_replication_contract
      - name: Florida housing tests
        run: python -m unittest tests.test_florida_housing
      - name: Florida foreclosure tests
        run: python -m unittest tests.test_florida_foreclosure
      - name: Phase 8A income protection tests
        run: python -m unittest tests.test_phase8_income_protection
      - name: State data semantic validator
        run: python scripts/validate_state_data.py
      - name: California foreclosure semantic validator
        run: python scripts/validate_california_foreclosure.py
      - name: Florida foreclosure semantic validator
        run: python scripts/validate_florida_foreclosure.py
      - name: Production dataset registry validator
        run: python scripts/validate_dataset_registry.py
      - name: Legal language review scan
        run: python tests/test_legal_language.py
