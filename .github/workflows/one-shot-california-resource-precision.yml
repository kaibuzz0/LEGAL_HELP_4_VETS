name: One-shot California provider precision

on:
  push:
    branches: [phase5-california-final-precision]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-california-final-precision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch federal overlay and California routing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          federal_path = Path('data/housing-federal.json')
          federal = json.loads(federal_path.read_text(encoding='utf-8'))
          federal['last_verified'] = '2026-09-02'
          ids = {x.get('id') for x in federal.get('overlays', [])}
          if 'project-based-section8' not in ids:
              federal['overlays'].append({
                  'id': 'project-based-section8',
                  'title': 'HUD Project-Based Section 8 / Multifamily Assistance — Program-Specific Termination Overlay',
                  'status': 'partially_verified',
                  'authority': 'HUD Handbook 4350.3, Chapter 8 / applicable multifamily program regulations',
                  'url': 'https://www.hud.gov/hud-partners/multifamily-handbook-4350-3',
                  'rule': 'Project-based Section 8 and related HUD multifamily assistance can create program-specific lease-termination, subsidy/assistance, written-notice, and judicial-eviction requirements that are separate from public housing, Housing Choice Voucher administration, HUD-VASH, and California unlawful-detainer procedure.',
                  'warning': 'Identify the exact multifamily program and governing project documents before applying a termination rule. Loss of subsidy, lease termination, owner termination, and state-court eviction are distinct events. No program-specific deadline is published in this overlay.'
              })
          federal_path.write_text(json.dumps(federal, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state_path = Path('data/states/california.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['last_verified'] = '2026-09-02'

          overlays = state.setdefault('federal_overlays', [])
          if 'project-based-section8' not in overlays:
              overlays.append('project-based-section8')

          auths = state.setdefault('primary_authorities', [])
          if not any(a.get('id') == 'ca-ccp-715-010' for a in auths):
              auths.append({
                  'id': 'ca-ccp-715-010',
                  'citation': 'Cal. Code Civ. Proc. § 715.010',
                  'title': 'California Code of Civil Procedure § 715.010 — Writ of Possession',
                  'authority_type': 'statute',
                  'jurisdiction': 'California',
                  'source_url': 'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CCP&sectionNum=715.010.',
                  'supports': ['A writ of possession states the five-day statutory removal period using service/posting mechanics; personal property remaining at the premises is separately governed.'],
                  'last_verified': '2026-09-02',
                  'status': 'verified'
              })

          sheriff = state['document_routes']['sheriff_notice_to_vacate']
          sheriff['authorities'] = ['ca-ccp-715-010', 'ca-courts-postjudgment']
          sheriff['description'] = 'After a possession judgment and issuance of the writ, CCP §715.010 supplies the controlling five-day removal language. The trigger depends on service of the writ copy on the occupant or, for a posted copy, service on the judgment debtor; current California Courts guidance provides practical post-judgment context.'
          sheriff['immediate_clock'] = {
              'value': 5,
              'unit': 'calendar_days_from_statutory_service_or_posting_trigger',
              'trigger': 'service_of_writ_copy_on_occupant_or_if_posted_service_of_copy_on_judgment_debtor',
              'computation_authority': 'ca-ccp-715-010',
              'exceptions': ['A court-ordered stay or other effective relief can change enforcement. Personal-property handling is separate from occupant removal.'],
              'verified': True,
              'display': 'CCP §715.010(b)(2) states five days from service of a copy of the writ on the occupant, or if the writ copy is posted, five days from service of a copy on the judgment debtor, before the levying officer removes occupants.'
          }
          sheriff['possession_consequences'] = ['After the statutory period, absent effective relief, the levying officer may remove occupants and restore possession. Property left at the premises follows separate statutory handling.']
          sheriff['last_verified'] = '2026-09-02'

          sub = state['document_routes']['subsidized_housing_termination']
          sub['description'] = 'Public housing, Housing Choice Voucher, project-based Section 8/multifamily assistance, and HUD-VASH are distinct federal program layers. A subsidy or assistance action, lease termination, owner termination, and California state-court eviction are not the same decision and do not automatically share one notice or appeal path.'
          sub_overlays = sub.setdefault('federal_overlays', [])
          if 'project-based-section8' not in sub_overlays:
              sub_overlays.append('project-based-section8')
          sub['immediate_clock'] = None
          sub['other_clocks'] = []
          sub['exceptions'] = [
              'Do not collapse public housing, HCV, project-based Section 8, and HUD-VASH into one program.',
              'Do not treat loss of subsidy or assistance as an automatic eviction judgment, or an eviction judgment as an automatic program-termination decision.',
              'Program-specific deadlines remain unpublished until the exact program and primary authority are verified.'
          ]
          sub['last_verified'] = '2026-09-02'

          resources = state.setdefault('resources', {})
          resources.update({
              'california_state_bar_lrs': {
                  'name': 'State Bar of California — Certified Lawyer Referral Services',
                  'type': 'bar_program',
                  'url': 'https://www.calbar.ca.gov/public/find-legal-professionals',
                  'coverage': 'Statewide directory of State Bar-certified lawyer referral services',
                  'service_area': 'California',
                  'eligibility_notes': 'Referral locator, not guaranteed representation; consultation fees and attorney fees can vary.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'california_free_legal_help': {
                  'name': 'State Bar of California — Free / Low-Cost Legal Help',
                  'type': 'legal_aid',
                  'url': 'https://www.calbar.ca.gov/public/legal-resources',
                  'coverage': 'Statewide access point to legal-aid resources and LawHelpCA',
                  'service_area': 'California',
                  'eligibility_notes': 'Eligibility, service area, case acceptance, and available legal topics vary by provider; no representation is guaranteed.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'california_veterans_legal_resources': {
                  'name': 'State Bar of California — Veterans and Service Members Legal Resources',
                  'type': 'veterans_clinic',
                  'url': 'https://www.calbar.ca.gov/public/legal-resources/resources-veterans-and-service-members',
                  'coverage': 'Current statewide/regional directory of veteran and servicemember legal-help resources',
                  'service_area': 'California',
                  'eligibility_notes': 'Directory/referral resource; each listed program has its own eligibility, subject-matter, capacity, and geographic limits.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'hud_housing_counselor': {
                  'name': 'HUD — Approved Housing Counselor Locator',
                  'type': 'foreclosure_assistance',
                  'url': 'https://www.hud.gov/stat/sfh/housing-counseling',
                  'coverage': 'National HUD-approved housing-counseling locator, including foreclosure and rental counseling',
                  'service_area': 'California / national locator',
                  'eligibility_notes': 'Housing counseling is not legal representation and does not itself stop a foreclosure or eviction.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'va_lsvh': {
                  'name': 'VA — Legal Services for Veterans (LSV-H) Grantee Referral',
                  'type': 'LSV-H',
                  'url': 'https://department.va.gov/homeless/legal-services-for-veterans/',
                  'coverage': 'Current VA-funded grantee referral information for eligible Veterans who are homeless or at risk',
                  'service_area': 'California / national grantee locator',
                  'eligibility_notes': 'No guaranteed representation; each grantee has eligibility, subject-matter, capacity, and service-area limitations.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'va_ssvf': {
                  'name': 'VA — Supportive Services for Veteran Families (SSVF) Provider Locator',
                  'type': 'SSVF',
                  'url': 'https://department.va.gov/homeless/supportive-services-for-veteran-families/',
                  'coverage': 'Current VA SSVF provider routing for homelessness prevention and rapid rehousing',
                  'service_area': 'California / national provider locator',
                  'eligibility_notes': 'SSVF is not a statutory entitlement or legal representation; local funding, eligibility, and services vary.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              },
              'va_home_loan_help': {
                  'name': 'VA — Help To Avoid Foreclosure',
                  'type': 'foreclosure_assistance',
                  'url': 'https://www.va.gov/housing-assistance/home-loans/trouble-making-payments/',
                  'coverage': 'VA-guaranteed home-loan foreclosure-avoidance assistance and loan-technician routing',
                  'service_area': 'California / nationwide VA home-loan program',
                  'eligibility_notes': 'VA guaranty does not mean VA owns or services the loan; option eligibility and servicer implementation vary and assistance does not automatically halt state foreclosure.',
                  'verified': True,
                  'last_verified': '2026-09-02'
              }
          })

          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run legal-data QA
        run: |
          python -m unittest tests.test_california_housing
          python -m unittest tests.test_california_foreclosure
          python -m unittest tests.test_state_schema
          python scripts/validate_state_data.py
          python scripts/validate_california_foreclosure.py
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-california-resource-precision.yml
          git add data/housing-federal.json data/states/california.json
          git commit -m 'Complete California statewide housing routing precision'
          git push origin HEAD:phase5-california-final-precision
