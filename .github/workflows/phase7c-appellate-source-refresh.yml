name: Phase 7C appellate source refresh

on:
  push:
    branches: [phase7-florida-postsale-local-precision]
    paths: [.github/workflows/phase7c-appellate-source-refresh.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-florida-postsale-local-precision
          fetch-depth: 0
      - name: Refresh Rule 9.310 provenance and regression
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/florida-foreclosure.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          a = next(x for x in d['authorities'] if x['id'] == 'fl-r-app-p-9-310')
          a['source_url'] = 'https://www-media.floridabar.org/uploads/2026/09/Appellate-Court-Rules-09-01-26.pdf'
          a['supports'] = [
              'Current Rule 9.310(a), in the Florida Rules of Appellate Procedure updated September 1, 2026, generally requires a party seeking a stay pending review to first move in the lower tribunal unless general law or a rule exception applies; filing an appeal does not itself create a stay in the ordinary foreclosure-possession route.'
          ]
          a['last_verified'] = '2026-09-02'
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          t = Path('tests/test_florida_foreclosure.py')
          s = t.read_text(encoding='utf-8')
          marker = '    def test_validator_rejects_section_83_62_as_foreclosure_bridge(self):\n'
          test = '''    def test_appellate_stay_rule_uses_current_september_2026_source(self):\n        authority = next(a for a in DATA["authorities"] if a["id"] == "fl-r-app-p-9-310")\n        self.assertIn("09-01-26.pdf", authority["source_url"])\n        self.assertNotIn("07-01-26.pdf", authority["source_url"])\n        self.assertIn("September 1, 2026", authority["supports"][0])\n\n'''
          if 'test_appellate_stay_rule_uses_current_september_2026_source' not in s:
              if marker not in s:
                  raise SystemExit('expected test insertion marker missing')
              s = s.replace(marker, test + marker)
              t.write_text(s, encoding='utf-8')
          PY
          python -m unittest tests.test_florida_foreclosure
          python scripts/validate_florida_foreclosure.py
          rm .github/workflows/phase7c-appellate-source-refresh.yml
      - name: Commit exact refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/florida-foreclosure.json tests/test_florida_foreclosure.py .github/workflows/phase7c-appellate-source-refresh.yml
          git commit -m 'legal: refresh Florida appellate stay authority to September 2026'
          git push origin HEAD:phase7-florida-postsale-local-precision
